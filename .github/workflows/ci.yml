name: CI

# No paths-ignore / branches filters (same reasoning as the campus
# monorepo's ci.yml): required checks must be REPORTED on every PR, and
# stacked/base-filtered links must still get runs.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  ENV: testing

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Same version as pyproject dev-deps so CI and `poetry run ruff` agree.
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    needs: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Python support tiers mirror the campus monorepo: 3.11-3.13 are
    # required (branch protection names these check runs verbatim);
    # 3.14 is bugfix-tier - signal only, never blocks, never protected.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      # Poetry pinned to the same version as the campus monorepo's composite
      # action so lockfiles stay interoperable across repos.
      - name: Install Poetry
        run: |
          pipx install poetry==2.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install package + dev deps
        run: poetry install
      - name: Check interface manifest
        run: poetry run python scripts/generate_interface_manifest.py --check
      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -t . -v

  build-and-audit:
    name: Build & Audit
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Install Poetry
        run: |
          pipx install poetry==2.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build wheels
        run: poetry build
      - name: Audit namespace packaging
        run: poetry run python scripts/audit_wheel_namespace.py
      # The install-surface smoke: prove the built wheel (not the src tree)
      # is installable and all four portions import from it. pip resolves
      # campus-common/campus-model from the URLs baked into the wheel
      # metadata and campus-python from its git URL.
      - name: Fresh-venv wheel smoke
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/pip install --quiet dist/flask_campus-*.whl
          smoke-venv/bin/python -c "import campus.flask_campus, campus.audit.middleware, campus.audit.client, campus.audit.http, campus.common.protocol; print('smoke OK:', campus.flask_campus.__file__)"
